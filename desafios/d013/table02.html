<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body {
            font-family:Arial, Helvetica, sans-serif
        }

        table {
            width: 300px;
            border-collapse: collapse;
        }

        caption {
            border: 2px solid black;
            background-color: gray;
            padding: 10px;
        }

        caption > span {
            text-decoration: underline;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tfoot {
            background-color: gray;
        }
    </style>
</head>
<body>
    <table>
        <caption>Desafio dois de <span>tabelas</span></caption>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            <td colspan="4">N</td>
        </tr>
        <tfoot>
            <tr>
                <th colspan="4">Total de Letras</th>
                <td>13</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
