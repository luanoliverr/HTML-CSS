<html lang="pt-br">
<head>

    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do
        
        <iframe 
        src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="no">
        <a href="https://www.cursoemvideo.com">CursoemVideo</a>

        </iframe>
        
        para aprender a programar.
    </p>
    <p>
        o site do

        <iframe
         src="https://www.gogle.com.br" frameborder="0">
         <a href="iframe001.html" target="_blank">Google</a>
        </iframe>

         não funciona dentro do iframe
    </p>
</body>
</html>
