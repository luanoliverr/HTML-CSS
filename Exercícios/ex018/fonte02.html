<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        /*
            Tipos de format()
            - opentype (otf) Universal
            - truetype (ttf) Universal
            - embedded-opentype
            - truetype-att (Apple Advanced Typography)
            - svg
        */
        @font-face {
            font-family: Love;
            src: url('fontes/love story ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ipsam doloribus, nemo qui quasi accusamus unde exercitationem beatae molestias quibusdam praesentium esse vel obcaecati itaque et sed totam. Blanditiis, consequatur error!</p>
</body>
</html>
